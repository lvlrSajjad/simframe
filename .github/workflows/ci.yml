name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # `bench` runs from these two rather than from every push. See its own comment.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# A superseded push should stop, not queue behind itself. The critical path here
# is a hosted macOS runner booting a simulator, so two pushes a minute apart used
# to mean two full device jobs and the second answer being the only one anybody
# read.
#
# Keyed on the **event as well as the ref**, and that second half was missing.
# Every trigger shared one lane per ref, so the nightly schedule and a push
# fought each other: on 2026-09-12 the 12:13 nightly cancelled the push run for
# `0769447` outright, and the commit reached main having been verified by
# nothing. It reads as flaky CI and it is not — it is two runs competing for one
# slot, one of which takes 28 minutes because it owns `bench`.
#
# Now a push supersedes a push on the same ref (which is the point), a tag has
# its own lane (it always did — a different ref), and the nightly neither
# cancels a push verification nor is cancelled by one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS only: the package declares "os": ["darwin"], so npm correctly refuses
  # to install it anywhere else.
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: CLI loads
        run: node src/cli.js --help

      # Seconds, no simulator, and it would have caught both regressions this
      # project has shipped. The required list is derived from the build's own
      # inputs, so it cannot rot the way a hand-written list did.
      - name: The package ships every build input
        run: node scripts/check-package.mjs

      # Client work is not repo material and one bundle id reached two public
      # commit diffs before anything was checking. The denylist is a repository
      # secret rather than a file, because a file listing what must not be in
      # the repo is a puzzle that solves itself. Without the secret this step
      # says it checked nothing and passes, which is what keeps it alive on
      # forks instead of being switched off.
      # Offline by construction: the element lists are recorded, and everything
      # downstream of them — resolution, identity, the change detector — is a
      # pure function. So the harness that gates every threshold in this project
      # runs in the check job, in a second, with no simulator.
      - name: Perception expectations still hold
        run: node scripts/eval-perception.mjs

      # simframe drives *your* app, so no particular app's bundle id belongs in
      # it. A pattern rather than a denylist, so it needs no configuration and
      # works on a fork and on a pull request from a stranger. The first version
      # of this waited for a secret nobody had supplied, and a third-party app's
      # field notes were committed and pushed while it sat there passing. The
      # env var is still read, for anyone who wants extra patterns, and nothing
      # depends on it existing.
      - name: No third-party app identifiers
        env:
          SIMFRAME_PRIVATE_STRINGS: ${{ secrets.SIMFRAME_PRIVATE_STRINGS }}
        run: node scripts/check-private.mjs

      - name: The packaged tarball can actually build the daemon
        # No pipe to `tail` here. `swift build | tail -3` reports tail's exit
        # code, so the previous version of this step could not fail — the one
        # check meant to catch a broken package was itself broken.
        run: |
          set -o pipefail
          npm pack --pack-destination /tmp >/dev/null
          rm -rf /tmp/pkgcheck && mkdir -p /tmp/pkgcheck && cd /tmp/pkgcheck
          tar -xzf /tmp/simframe-*.tgz
          swift build -c release --package-path package/native/simframed

      - name: Registry manifest agrees with package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const checks = {
              "package.json mcpName matches server.json name": pkg.mcpName === srv.name,
              "versions match": pkg.version === srv.version,
              "package version matches": srv.packages[0].version === pkg.version,
              "npm identifier matches": srv.packages[0].identifier === pkg.name,
            };
            let failed = false;
            for (const [label, ok] of Object.entries(checks)) {
              console.log(`${ok ? "ok  " : "FAIL"} ${label}`);
              if (!ok) failed = true;
            }
            process.exit(failed ? 1 : 0);
          '

  # The job that would have caught what the unit tests could not: install the
  # tarball the way a user does, on a real simulator, and refuse to pass if any
  # layer has quietly degraded.
  integration:
    runs-on: macos-15
    # 25 was the bound before the fingerprint distributions were measured here;
    # eighteen cold perception passes on a runner with no GPU need the rest.
    timeout-minutes: 40
    env:
      SIMFRAME_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Install from the packed tarball, as a user would
        run: |
          set -o pipefail
          npm pack --pack-destination /tmp
          npm install -g /tmp/simframe-*.tgz
          simframe --version
          # Where the daemon will be built, so the cache below can address it.
          echo "SIMFRAMED_BUILD=$(npm root -g)/simframe/native/simframed/.build" >> "$GITHUB_ENV"

      # The daemon is Swift, and compiling it is 172 of this job's ~780 seconds
      # — measured, not guessed. The key is the hash of the Swift sources plus
      # the runner image, so a source change or a new toolchain misses and
      # rebuilds; nothing else can serve a binary that does not match.
      - name: Cache the built daemon
        uses: actions/cache@v4
        with:
          path: ${{ env.SIMFRAMED_BUILD }}
          key: simframed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/simframed/**') }}

      # And a restored binary has to look newer than its sources, or the build
      # runs anyway. `engine.js` rebuilds when the binary's mtime is older than
      # the newest Swift source, which is exactly what a fresh checkout
      # guarantees: tar restores the binary's original mtime while checkout
      # stamps every source with now. The cache key already proves the sources
      # match, so this asserts what the key has established rather than
      # overriding a real staleness check.
      - name: A restored binary is not a stale binary
        run: |
          bin="$SIMFRAMED_BUILD/release/simframed"
          if [ -f "$bin" ]; then touch "$bin"; echo "restored: $bin"; else echo "no cached daemon; it will be built"; fi

      - name: Boot a simulator
        # Use a simulator the image already has, rather than creating one. The
        # first version of this picked the LAST iPhone device type in the list —
        # `iPhone 6s Plus` — which has no runtime on macos-15, so the job died
        # before testing anything. Pick the newest installed runtime, then its
        # ordinary flagship, so the choice stays predictable as images change.
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8"));
            // Filter to iOS iPhones, do not merely prefer them. Ranking alone
            // picked an Apple Vision Pro: runtime ids sort as strings, and
            // "xrOS-26-2" sorts after "iOS-26-5", so the newest runtime was
            // xrOS and every device in it is a Vision Pro.
            const rows = Object.entries(j.devices)
              .filter(([rt]) => /SimRuntime\.iOS-/.test(rt))
              .flatMap(([rt, ds]) => ds
                .filter((d) => d.isAvailable && /^iPhone/.test(d.name))
                .map((d) => ({ udid: d.udid, name: d.name, rt })));
            if (!rows.length) { console.error("no available iPhone simulator on this runner"); process.exit(1); }
            const runtime = [...new Set(rows.map((d) => d.rt))]
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).pop();
            const here = rows.filter((d) => d.rt === runtime);
            const rank = (n) =>
              /^iPhone \d+ Pro$/.test(n) ? 0 : /^iPhone \d+$/.test(n) ? 1 : /^iPhone \d/.test(n) ? 2 : 3;
            here.sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name, undefined, { numeric: true }));
            const pick = here[0];
            process.stderr.write(`using ${pick.name} on ${runtime.split(".").pop()}\n`);
            process.stdout.write(pick.udid);
          ')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          # And WAIT for it. `simctl boot` returns before the device is usable,
          # and nothing here waited — so every layer downstream was racing the
          # boot. That one omission is the best available explanation for three
          # different failures in four runs on this job: `ax.driver = null`
          # because AXPTranslation had not attached yet, `simctl launch` taking
          # 47-55s and failing three times in a row, and a HOME press that never
          # settled. Different symptoms, one cause.
          #
          # `bootstatus -b` boots if needed and blocks until fully booted. It is
          # named in actions/runner-images#11874 as the workaround that fixed
          # exactly this, and external research (docs/research/) calls it the
          # highest-value single change available for hosted-runner simulator
          # reliability. Timeboxed, because a boot that never completes should
          # fail here with a clear reason rather than as a puzzle further down.
          # No `timeout` wrapper: macOS does not ship GNU coreutils, so `timeout`
          # is not on a runner's PATH — it is on mine, via Homebrew, which is
          # why the first version of this line passed locally and failed on the
          # runner with `timeout: command not found`. The job's own
          # `timeout-minutes` already bounds a hang, which is the portable answer.
          xcrun simctl bootstatus "$DEVICE" -b || {
            echo "::error::the simulator never reported a completed boot"
            exit 1
          }
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Start capture
        run: simframe start --device="$DEVICE"

      # SIMFRAME_STRICT=1 is set for the whole job, so any degraded layer — a
      # daemon that would not build, OCR unavailable, input falling back to idb
      # — exits non-zero here instead of passing quietly.
      - name: Every layer is the good one, or this fails
        run: |
          set -o pipefail
          # Wait for the layers, then assert. The assertion is "every layer is
          # the good one", not "every layer is the good one within zero seconds
          # of starting capture" — and `ax.driver = null` has failed this step
          # twice, including on a docs-only commit, because AXPTranslation
          # attaches in-process and had not finished doing so. Item 95 named
          # that exact symptom and answered it with `bootstatus -b`, which
          # waits for the *boot*; nothing waited for this.
          #
          # `doctor` itself deliberately does not wait — it reports what is true
          # now, which is what makes it worth reading. So the patience lives
          # here, bounded, and a layer that never arrives still fails with the
          # same clear reason as before.
          for attempt in $(seq 1 12); do
            simframe doctor --json --device="$DEVICE" > /tmp/doctor.json 2>/dev/null || true
            if node -e 'const d=require("/tmp/doctor.json"); process.exit(d["ax.driver"]==="simframed" && d["capture.engine"]==="simframed" ? 0 : 1)' 2>/dev/null; then
              echo "     (layers ready after ${attempt} check(s))"
              break
            fi
            sleep 5
          done
          simframe doctor --json --device="$DEVICE" | tee /tmp/doctor.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/doctor.json", "utf8"));
            const want = { "capture.engine": "simframed", "ocr.available": true };
            let failed = false;
            for (const [k, v] of Object.entries(want)) {
              const ok = d[k] === v;
              console.log(`${ok ? "ok  " : "FAIL"} ${k} = ${JSON.stringify(d[k])} (want ${JSON.stringify(v)})`);
              if (!ok) failed = true;
            }
            // Input and the accessibility tree must both be the daemon, not
            // idb. idb is not installed on a hosted runner, so a fallback here
            // shows up as unavailable — either way it is not simframed and it
            // is not acceptable.
            for (const key of ["input.driver", "ax.driver"]) {
              const got = d[key];
              const ok = got === "simframed";
              console.log(`${ok ? "ok  " : "FAIL"} ${key} = ${JSON.stringify(got)} (want "simframed")`);
              if (!ok) failed = true;
            }
            if (d.warnings > 0) {
              console.log(`\n${d.warnings} degraded layer(s):`);
              for (const c of d.checks.filter((c) => c.level !== "ok")) console.log(`  ${c.level} ${c.name}: ${c.detail}`);
            }
            process.exit(failed ? 1 : 0);
          '

      - name: A step runs, and capture notices the screen change
        # This step has been wrong three times, and every wrong version failed
        # for a reason outside the thing being tested:
        #
        #   1. Assert a frame counter advances — it cannot on an idle screen,
        #      because capture is damage-driven.
        #   2. Launch an app and assert the screen changed — it does not, if
        #      that app is already in front.
        #   3. Swipe from the top edge and assert Notification Center opens —
        #      the swipe was delivered correctly (the log says so) and the
        #      screen simply did not change on a bare springboard. That test was
        #      measuring iOS, not simframe.
        #
        # What this step needs to prove is narrow: a step runs without error,
        # and capture notices the resulting change. Whether the daemon owns the
        # input path is a stronger claim, and `doctor` already asserts it
        # (input.driver == "simframed"). Opening a URL launches Safari, which
        # every iOS simulator has, so the screen change is guaranteed.
        #
        # The frame HASH is the assertion; `seq` resets when the daemon
        # restarts, so it is reported only.
        run: |
          set -o pipefail
          read_state() {
            simframe state --device="$DEVICE" --json \
              | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(s.hash+" "+s.seq)'
          }
          # Both settles in this step need the runner's budget, not one of them.
          # The previous commit widened the openUrl flow's and left this one at
          # its default, and *this* is the one that then failed — "pressed home
          # (never settled)", then the settle giving up at 9.3s, with the
          # two-step flow taking 36s in total. Going to the home screen is a
          # springboard animation, which is exactly the kind of thing a loaded
          # build farm makes slow.
          printf '[{"button":"home"},{"settle":{"timeoutMs":25000}}]\n' > /tmp/reset.json
          # Retried, and NOT widened again.
          #
          # 8 s failed, so it went to 25 s, and then 25 s failed too — with the
          # map printing `screen unidentified · STILL MOVING · no elements read
          # on this screen` after 61 s. A screen that is moving, unreadable and
          # unidentified for a minute is not a screen that needs thirty more
          # seconds, and widening a budget twice for a screen that may never
          # settle is answering the wrong question. Going up again would be the
          # third guess in a row.
          #
          # So: retry, and say what was actually on screen when it failed. The
          # reset is a *precondition* — the assertion this step exists for is
          # the frame hash changing after `openUrl`, below — and a precondition
          # that fails on a cold, loaded runner deserves the same patience the
          # `openurl` timeout already gets, plus a diagnosis so the next
          # occurrence is read rather than inferred.
          for reset in 1 2 3; do
            if simframe do /tmp/reset.json --device="$DEVICE"; then
              break
            fi
            echo "     (the reset did not settle on attempt $reset — what the device was showing:)"
            simframe state --device="$DEVICE" --json || true
            simframe ui --device="$DEVICE" || true
            if [ "$reset" = 3 ]; then
              echo "FAIL the device never reached a settled home screen in 3 attempts." >&2
              echo "     That is not a slow runner; read the state above." >&2
              exit 1
            fi
            sleep 5
          done
          BEFORE=$(read_state)
          # A settle budget, stated rather than defaulted. The default is a cold
          # p95 plus margin measured on a developer's machine; this runner has
          # taken 45s for a two-step flow, and step 11 has failed with
          # `settle: screen did not settle within 8056ms` more than once. What
          # this step asserts is that **capture notices a change** — the speed
          # at which Safari launches on a loaded build farm is not the subject,
          # so the budget is widened rather than the assertion weakened.
          printf '[{"openUrl":"https://example.com"},{"settle":{"timeoutMs":25000}}]\n' > /tmp/flow.json
          # Retried, and only here. `xcrun simctl openurl` returns
          # NSPOSIXErrorDomain code 60 — "Operation timed out" — on a loaded
          # hosted runner: three consecutive runs failed on it while the same
          # commit passed on a quieter one, and the flow immediately before it
          # took 33 s against 21 s on the passing run. simctl times out
          # internally, so simframe never gets to see it, and the timeout does
          # not mean the URL failed to open — it means simctl stopped waiting.
          #
          # Deliberately NOT retried inside simframe. `openurl` may well have
          # succeeded before it stopped answering, so a product-level retry can
          # open the URL twice, and an action that fires twice is exactly what
          # the verify barrier in CLAUDE.md exists to prevent. A timeout stays a
          # hard failure for a real user, who can see their own screen. This
          # loop buys the runner patience, not simframe dishonesty.
          for attempt in 1 2 3; do
            if simframe do /tmp/flow.json --device="$DEVICE"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "FAIL openUrl failed $attempt times; this is no longer the runner" >&2
              exit 1
            fi
            echo "     (openUrl failed on attempt $attempt — retrying; see the comment above)"
            sleep 5
          done
          AFTER=$(read_state)
          node -e '
            const [bh, bs] = process.argv[1].split(" ");
            const [ah, as] = process.argv[2].split(" ");
            const moved = bh !== ah;
            console.log(`${moved ? "ok  " : "FAIL"} frame hash changed: ${bh.slice(0, 10)} -> ${ah.slice(0, 10)}`);
            console.log(`     seq ${bs} -> ${as}`);
            if (!moved) console.error("a step ran cleanly but capture saw no change; the pipeline is not live");
            process.exit(moved ? 0 : 1);
          ' "$BEFORE" "$AFTER"

      - name: The memory layer — screen map, refs, graph, verdicts, flows
        # Everything the integration job asserted until now was capture, input
        # and OCR. The layer above them had no coverage at all, and it is where
        # every expensive bug in this project has lived: a state version that
        # had drifted so every command respawned the daemon, `tap <label>`
        # crashing on any screen the graph recognised, a tap and a type sharing
        # one edge, a halted flow reporting success. Each was found by hand or by
        # somebody else running the tool. None by CI.
        #
        # Both perception layers are live here now that the tree is read
        # in-process, so this covers the merged map rather than OCR alone.
        run: node scripts/ci-memory.mjs --device="$DEVICE"

      - name: The fingerprint distributions, measured and bounded
        # The threshold that decides whether two readings are the same screen is
        # a measured artifact, and it was being re-measured by a person noticing
        # that a number had moved. It moved from 0.65 to 0.42 in one afternoon
        # and the cause was not the fingerprint at all — one reading taken on the
        # wrong screen, plus same-screen pairs whose sensors differed, which the
        # graph absorbs by design. Both are now named as themselves and neither
        # can be reported as drift.
        #
        # This fails on two conditions rather than on `gap > 0`: every
        # same-screen revisit must clear the threshold by 0.10, and every
        # different-screen pair must stay 0.10 below it. A gap can be wide while
        # the threshold sits at the edge of it, and the edge is where a screen
        # gets misclassified.
        #
        # Three rounds, not four: 18 same-screen pairs is enough to catch a
        # regression, and every reading is a cold perception pass on a runner
        # with no GPU. When this fails it is worth reading which of the two
        # conditions failed — a tour that went somewhere unintended says so
        # explicitly, and that is a tour fix, not a threshold fix.
        #
        # Deliberately not piped. An earlier local run of this sent its output
        # through `tail` and got tail's exit code, so a run whose distributions
        # had overlapped completely reported success.
        run: node scripts/eval-fingerprint.mjs --tour=test/tours/device-native.json --rounds=3 --device="$DEVICE" --out=/tmp/fingerprint-distributions.json --label="ci-${{ github.sha }}"

      - name: Keep the distributions
        # Recorded every run, so the two distributions can be read as a series
        # rather than as today's number. The file carries every reading's tokens
        # and elements, which is what makes a narrowing diagnosable after the
        # fact instead of only while it is happening.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-distributions
          path: /tmp/fingerprint-distributions.json
          if-no-files-found: warn

      - name: Daemon log, on failure
        if: failure()
        run: |
          simframe status --device="$DEVICE" || true
          cat ~/.simframe/*/simframed.log 2>/dev/null | tail -40 || true

      - name: Tear down
        if: always()
        run: |
          simframe stop --all || true
          xcrun simctl shutdown "$DEVICE" || true
          xcrun simctl delete "$DEVICE" || true

  # The Human Parity Index, measured on every push.
  #
  # Phases 10–16 are scored on two numbers — model turns removed, and HPI —
  # and a number nobody recomputes is a number that quietly stops being true.
  # This job runs the agent side of the flow suite and compares it against the
  # committed baseline. The human side of the ratio is recorded once by a
  # person and committed under docs/research/human-baselines/.
  #
  # NOT on the push path, and that is a deliberate trade with a measured reason.
  # This job cost **28 minutes of a 28-minute run** — it *was* the wall clock —
  # and it cannot fail a build: `bench-hpi` exits 2 for "could not measure" on a
  # hosted runner, because simctl operations time out internally on a loaded
  # build farm, and the workflow turns that 2 into a `::warning`. So every push
  # was waiting 28 minutes for a warning. DEFERRED already stated that a gate
  # which only ever warns is not protecting anything; this stops paying for it
  # per push.
  #
  # HPI stays measured — nightly, on demand, and on a release tag — which is
  # what research §1 says it is for: a trend on a known device, not a per-commit
  # gate. When one of the three ways out in DEFERRED lands (a self-hosted box is
  # the real one), this can go back on the push path and mean something.
  bench:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Boot a simulator
        # Same device choice as the integration job, and for the same reasons —
        # see the long comment there. Deliberately not factored into a shared
        # script: a bench that silently starts measuring a different device
        # class would look like a performance regression.
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const rows = Object.entries(j.devices)
              .filter(([rt]) => /SimRuntime\.iOS-/.test(rt))
              .flatMap(([rt, ds]) => ds
                .filter((d) => d.isAvailable && /^iPhone/.test(d.name))
                .map((d) => ({ udid: d.udid, name: d.name, rt })));
            if (!rows.length) { console.error("no available iPhone simulator on this runner"); process.exit(1); }
            const runtime = [...new Set(rows.map((d) => d.rt))]
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).pop();
            const here = rows.filter((d) => d.rt === runtime);
            const rank = (n) =>
              /^iPhone \d+ Pro$/.test(n) ? 0 : /^iPhone \d+$/.test(n) ? 1 : /^iPhone \d/.test(n) ? 2 : 3;
            here.sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name, undefined, { numeric: true }));
            process.stderr.write(`using ${here[0].name} on ${runtime.split(".").pop()}\n`);
            process.stdout.write(here[0].udid);
          ')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          # And WAIT for it. `simctl boot` returns before the device is usable,
          # and nothing here waited — so every layer downstream was racing the
          # boot. That one omission is the best available explanation for three
          # different failures in four runs on this job: `ax.driver = null`
          # because AXPTranslation had not attached yet, `simctl launch` taking
          # 47-55s and failing three times in a row, and a HOME press that never
          # settled. Different symptoms, one cause.
          #
          # `bootstatus -b` boots if needed and blocks until fully booted. It is
          # named in actions/runner-images#11874 as the workaround that fixed
          # exactly this, and external research (docs/research/) calls it the
          # highest-value single change available for hosted-runner simulator
          # reliability. Timeboxed, because a boot that never completes should
          # fail here with a clear reason rather than as a puzzle further down.
          # No `timeout` wrapper: macOS does not ship GNU coreutils, so `timeout`
          # is not on a runner's PATH — it is on mine, via Homebrew, which is
          # why the first version of this line passed locally and failed on the
          # runner with `timeout: command not found`. The job's own
          # `timeout-minutes` already bounds a hang, which is the portable answer.
          xcrun simctl bootstatus "$DEVICE" -b || {
            echo "::error::the simulator never reported a completed boot"
            exit 1
          }
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Start capture
        run: node src/cli.js start --device="$DEVICE"

      - name: Run the flow suite and gate on HPI
        # No pipe. `node script.mjs | tee` reports tee's exit status, and this
        # project has already shipped one check that could not fail because of
        # exactly that.
        #
        # Three exit codes, three different answers:
        #   0  measured, and no regression
        #   1  measured, and it got worse — the gate fires
        #   2  could not measure: a wedged capture loop, or a host that cannot
        #      launch the app at all
        #
        # 2 is a warning rather than a failure, and that is a deliberate,
        # documented weakness. The first bench run on a hosted runner spent
        # nine minutes failing `simctl launch com.apple.Preferences` — 47 to
        # 55 s per attempt — which is the same fault this repo already records
        # for `simctl openurl` on a loaded runner. A gate that goes red for the
        # runner's simctl timeouts is a gate people switch off. So it says so
        # loudly, uploads what it has, and stays green; docs/DEFERRED.md
        # records that HPI is therefore not yet gated on hosted CI, and what it
        # would take to be.
        #
        # With no committed baseline the gate prints GATE INACTIVE and exits 0 —
        # loudly inactive rather than quietly passing, because a gate with
        # nothing to compare against cannot detect a regression.
        run: |
          set +e
          node scripts/bench-hpi.mjs --device="$DEVICE" --runs=3 --passes=3 --out=/tmp/hpi.json --gate
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "::warning title=HPI not measured::The suite could not run on this host (see the log). Not a regression, and not a passing gate either."
            exit 0
          fi
          exit "$code"

      - name: Keep the measurement
        # Recorded every run so HPI can be read as a series. This is the file
        # that becomes docs/research/hpi-baseline.json when a run is adopted
        # as the baseline.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpi
          path: /tmp/hpi.json
          if-no-files-found: warn

      - name: Escalation breakdown
        # Printed rather than gated. Phase ordering is a human decision made
        # from this table; a CI job is not the place to fail on it.
        if: always()
        run: node src/cli.js escalations --device="$DEVICE" || true

      - name: Tear down
        if: always()
        run: |
          node src/cli.js stop --all || true
          xcrun simctl shutdown "$DEVICE" || true
