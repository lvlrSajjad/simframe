name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS only: the package declares "os": ["darwin"], so npm correctly refuses
  # to install it anywhere else.
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: CLI loads
        run: node src/cli.js --help
      - name: The package ships everything the code needs at runtime
        # A file missing from "files" does not fail a build or a test — it fails
        # silently for whoever installs it. OCR shipped disabled exactly this way.
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
            const required = ["native/ocr.swift", "src/ocr.js", "src/cli.js", "src/mcp.js"];
            const missing = required.filter((r) => !files.includes(r));
            for (const f of required) console.log(`${missing.includes(f) ? "MISSING" : "ok     "} ${f}`);
            if (missing.length) {
              console.error(`\n${missing.length} runtime file(s) absent from the published package`);
              process.exit(1);
            }
          '

      - name: Registry manifest agrees with package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const checks = {
              "package.json mcpName matches server.json name": pkg.mcpName === srv.name,
              "versions match": pkg.version === srv.version,
              "package version matches": srv.packages[0].version === pkg.version,
              "npm identifier matches": srv.packages[0].identifier === pkg.name,
            };
            let failed = false;
            for (const [label, ok] of Object.entries(checks)) {
              console.log(`${ok ? "ok  " : "FAIL"} ${label}`);
              if (!ok) failed = true;
            }
            process.exit(failed ? 1 : 0);
          '

  doctor:
    # A hosted runner has simctl but no guarantee of a booted simulator, so this
    # checks that doctor runs and reports rather than that capture succeeds.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node src/cli.js doctor || true
      - run: node src/cli.js devices --all
