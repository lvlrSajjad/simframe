name: release

# Publishes to npm and to the official MCP Registry when a v* tag is pushed.
#
# No secrets. Both halves authenticate with this workflow's GitHub OIDC
# identity, which is why `id-token: write` is granted below.
#
# npm side that requires a one-time setup on npmjs.com, not here: the simframe
# package needs a Trusted Publisher pointing at this repository and this
# workflow file (Package → Settings → Trusted Publisher → GitHub Actions).
# Without that entry npm has nothing to trust and the publish fails with
# ENEEDAUTH, exactly as it did when NPM_TOKEN was absent.
#
# This replaced a token because npm is ending token publishing in January 2027,
# and the token that worked needed 2FA bypass — which npm's own UI warns
# against for CI. An OIDC identity cannot leak, expire, or be copied.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # macOS, because package.json declares "os": ["darwin"] and npm ci honours it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20, and this is load-bearing. Trusted Publishing needs npm
          # 11.5.1 or newer to recognise the OIDC environment, so the step below
          # upgrades npm — and npm 12 requires Node >= 22. On Node 20 that
          # upgrade fails with EBADENGINE *before* the publish step runs, which
          # is how v0.5.1 came to be tagged, released on GitHub, and never
          # published to npm. v0.5.0 worked only because npm@latest was still
          # 11.x that afternoon. Nothing warned; the tag simply went nowhere.
          #
          # This is only the Node that does the publishing. `engines` still says
          # >=18.17 and CI still tests 18, 20 and 22, so it changes nothing
          # about who can install simframe.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node cannot pin an npm version, so upgrade it here.
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm test

      - name: Tag, package.json and server.json must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const tag = process.argv[1];
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const problems = [];
            if (pkg.version !== tag) problems.push(`tag ${tag} != package.json ${pkg.version}`);
            if (srv.version !== tag) problems.push(`tag ${tag} != server.json ${srv.version}`);
            if (srv.packages[0].version !== tag) problems.push(`tag ${tag} != server.json package version ${srv.packages[0].version}`);
            if (pkg.mcpName !== srv.name) problems.push(`mcpName ${pkg.mcpName} != server.json name ${srv.name}`);
            if (problems.length) {
              console.error(problems.join("\n"));
              process.exit(1);
            }
            console.log(`version ${tag} is consistent across package.json and server.json`);
          ' "$TAG"

      - name: Install mcp-publisher
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64|aarch64) ASSET_ARCH=arm64 ;;
            x86_64) ASSET_ARCH=amd64 ;;
            *) echo "unsupported arch $ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_darwin_${ASSET_ARCH}.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      # A version with a hyphen in it is a prerelease: 0.6.0-rc.0, not 0.6.0.
      # This decides two things below, and getting either wrong is worse than
      # not shipping.
      - name: Is this a prerelease?
        id: kind
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "$VERSION is a prerelease" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "$VERSION is a release" ;;
          esac

      - name: Publish to npm
        # Publishing by hand and then tagging is a normal thing to do, and npm
        # rejects a version that already exists. That must not stop the run
        # before the registry step, so an existing version is a skip, not a
        # failure. Any other npm error still fails the job.
        #
        # The dist-tag is not cosmetic. `npm publish` with no --tag writes
        # `latest` whatever the version says, so a release candidate published
        # without this becomes what every `npm i simframe` installs — a silent
        # downgrade in stability for everyone, from a tag that was meant to test
        # the pipeline. Prereleases go to `next`; people opt in with @next.
        run: |
          VERSION="${{ steps.kind.outputs.version }}"
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "publishing simframe@$VERSION under dist-tag $DIST_TAG"
          if npm view "simframe@$VERSION" version >/dev/null 2>&1; then
            echo "simframe@$VERSION is already on npm — skipping"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      # npm does not make a version resolvable the instant `npm publish` exits.
      # It runs an automated review first — the web UI says "Validating: the
      # version will remain unavailable until review completes" — and until that
      # finishes, `npm view simframe@<version>` is a 404.
      #
      # Two things went wrong for want of this step. The MCP Registry validates
      # that the npm version exists before it will register it, so it failed
      # with a 400 on a version that had genuinely just published. And more
      # importantly, nothing in this workflow ever confirmed that a publish
      # landed — v0.5.1 was tagged, released on GitHub, and absent from npm for
      # a week without a single red mark to say so.
      - name: The version has to actually be on npm
        run: |
          VERSION="${{ steps.kind.outputs.version }}"
          for attempt in $(seq 1 40); do
            if npm view "simframe@$VERSION" version >/dev/null 2>&1; then
              echo "simframe@$VERSION is live on npm after $attempt check(s)"
              exit 0
            fi
            echo "  attempt $attempt: not resolvable yet, waiting"
            sleep 15
          done
          echo "simframe@$VERSION never became resolvable on npm within 10 minutes."
          echo "The publish step reported success, so this is npm's review queue"
          echo "rather than a rejected publish — but it is not a release until"
          echo "someone can install it."
          exit 1

      - name: Publish to the MCP Registry
        # Releases only. The registry lists one version as the thing to install,
        # and a release candidate is by definition not that.
        if: steps.kind.outputs.prerelease != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: A prerelease stops here
        if: steps.kind.outputs.prerelease == 'true'
        run: |
          echo "simframe@${{ steps.kind.outputs.version }} is on npm under @next."
          echo "The MCP Registry was deliberately skipped: it lists the version to install."
          echo "Install it with: npm i simframe@next"
